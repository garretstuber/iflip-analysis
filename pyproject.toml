[project]
name = "iflip-analysis"
version = "0.0.1"
description = "Visualization and preprocessing tools for FLIM fiber-photometry data acquired with the iFLiP rig"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Stuber Lab" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "xarray>=2024.6",
    "plotly>=5.22",
    "streamlit>=1.36",
    "phasorpy>=0.9",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[project.scripts]
iflip-app = "iflip.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iflip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PD"]
ignore = [
    "E501",   # line-length handled by formatter
    "PD011",  # false positive on PETH dataclass's real `values` ndarray field
]
